<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>

  <!-- Letter K -->
  <g fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="72">
    <text x="65" y="130" text-anchor="middle">K</text>
  </g>

  <!-- Letter N -->
  <g fill="white" font-family="Arial, sans-serif" font-weight="bold" font-size="72">
    <text x="135" y="130" text-anchor="middle">N</text>
  </g>

  <!-- Subtle highlight effect -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
</svg>
